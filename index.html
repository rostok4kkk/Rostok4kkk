<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f5f7;
            font-family: Arial, sans-serif;
            color: #171717;
        }

        .container {
            width: 900px;
            max-width: 92%;
            margin: 60px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
        }

        .clock {
            margin-top: 15px;
            font-size: 64px;
            font-weight: bold;
        }

        .date {
            margin-top: 8px;
            color: #777;
            font-size: 18px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-top: 0;
        }

        .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            background: #171717;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        li span {
            flex: 1;
        }

        .delete {
            background: #e8e8e8;
            color: #222;
            padding: 7px 10px;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .notes textarea {
            width: 100%;
            height: 180px;
            resize: vertical;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 13px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        @media (max-width: 700px) {
            .content {
                grid-template-columns: 1fr;
            }

            .clock {
                font-size: 45px;
            }

            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Rostok4kkk</h1>

            <div class="clock" id="time">00:00:00</div>

            <div class="date" id="date"></div>
        </div>

        <div class="content">

            <div class="card">
                <h2>Мои задачи</h2>

                <div class="task-input">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Введите задачу..."
                    >

                    <button id="addTask">
                        Добавить
                    </button>
                </div>

                <ul id="taskList"></ul>
            </div>

            <div class="card notes">
                <h2>Мои заметки</h2>

                <textarea
                    id="notes"
                    placeholder="Напишите что-нибудь..."
                ></textarea>
            </div>

        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const time = new Intl.DateTimeFormat("ru-RU", {
                timeZone: "Europe/Kyiv",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }).format(now);

            const date = new Intl.DateTimeFormat("ru-RU", {
                timeZone: "Europe/Kyiv",
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(now);

            document.getElementById("time").textContent = time;
            document.getElementById("date").textContent = date;
        }

        updateClock();
        setInterval(updateClock, 1000);


        const taskInput = document.getElementById("taskInput");
        const addTask = document.getElementById("addTask");
        const taskList = document.getElementById("taskList");


        function createTask(text) {
            const li = document.createElement("li");

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const span = document.createElement("span");
            span.textContent = text;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Удалить";
            deleteButton.className = "delete";

            checkbox.addEventListener("change", function () {
                span.classList.toggle(
                    "completed",
                    checkbox.checked
                );
            });

            deleteButton.addEventListener("click", function () {
                li.remove();
            });

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(deleteButton);

            taskList.appendChild(li);
        }


        addTask.addEventListener("click", function () {
            const text = taskInput.value.trim();

            if (text === "") {
                return;
            }

            createTask(text);

            taskInput.value = "";
            taskInput.focus();
        });


        taskInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTask.click();
            }
        });


        createTask("Создать мой первый сайт");
        createTask("Изучить JavaScript");
    </script>

</body>
</html>
